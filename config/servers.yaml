# Clothes Recommend System — MCP server registry
#
# local  -> STDIO transport (client spawns the process)
# remote -> Streamable HTTP transport (client connects to a URL)

servers:
  clothes_recommend_local:
    type: local
    transport: stdio
    command: python
    args:
      - servers/local_stdio/server.py
    tools:
      - get_location_weather
      - recommend_clothes
      - recommend_clothes_for_location
    description: Local Clothes Recommend MCP server (STDIO)

  clothes_recommend_remote:
    type: remote
    transport: streamable-http
    url: http://localhost:8000/mcp
    tools:
      - get_location_weather
      - recommend_clothes
      - recommend_clothes_for_location
    description: Remote Clothes Recommend MCP server (HTTP)
