[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clothes-recommend-system"
version = "1.0.0"
description = "Clothes Recommend System — weather-aware outfit recommendations over FastMCP (local STDIO and remote HTTP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
clothes-recommend = "clothes_recommend.main:main"

[tool.setuptools.packages.find]
where = ["src"]
