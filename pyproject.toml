[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clothes-recommend-system"
version = "1.1.0"
description = "MCP clothes recommendations plus production RAG retriever comparison toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "chromadb>=0.5",
    "gradio>=4.44",
    "openai>=1.40",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
clothes-recommend = "clothes_recommend.main:main"
rag-compare = "rag_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clothes_recommend = ["host/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
