[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-using-mcp"
version = "0.1.0"
description = "Python structure for connecting AI agents to local (STDIO) and remote (Streamable HTTP) MCP servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
mcp-agent = "mcp_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
